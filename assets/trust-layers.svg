<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Menlo,monospace">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#58a6ff" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#3fb950" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#d29922" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="320" rx="8" fill="#0d1117"/>

  <!-- Terminal dots + brand -->
  <circle cx="20" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="14" r="5" fill="#febc2e"/>
  <circle cx="52" cy="14" r="5" fill="#28c840"/>
  <text x="340" y="18" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">PIP-003: TRUST LAYERS</text>

  <text x="340" y="40" fill="#6e7681" font-size="9" text-anchor="middle">each layer adds a guarantee the layer below cannot provide</text>

  <!-- ─── Layer 3: TSA (top, amber) ─── -->
  <rect x="40" y="56" width="600" height="64" rx="6" fill="#1a1500" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="68" y="78" fill="#d29922" font-size="13" font-weight="bold">TIME BINDING</text>
  <text x="68" y="96" fill="#8b949e" font-size="10">RFC 3161 TSA</text>
  <text x="68" y="110" fill="#6e7681" font-size="8">proves: "this checkpoint existed before time T"</text>
  <!-- right side: mechanism -->
  <text x="620" y="78" fill="#d29922" font-size="9" text-anchor="end">punkgo-jack anchor</text>
  <text x="620" y="94" fill="#484f58" font-size="8" text-anchor="end">DigiCert / Sigstore TSA</text>
  <text x="620" y="110" fill="#484f58" font-size="8" text-anchor="end">prevents backdating</text>

  <!-- ─── Layer 2: Ed25519 (middle, green) ─── -->
  <rect x="40" y="132" width="600" height="64" rx="6" fill="#0a1f0d" stroke="#3fb950" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="68" y="154" fill="#3fb950" font-size="13" font-weight="bold">IDENTITY BINDING</text>
  <text x="68" y="172" fill="#8b949e" font-size="10">Ed25519 checkpoint signing</text>
  <text x="68" y="186" fill="#6e7681" font-size="8">proves: "this kernel instance signed this checkpoint"</text>
  <!-- right side -->
  <text x="620" y="154" fill="#3fb950" font-size="9" text-anchor="end">sig/ed25519:&lt;pubkey&gt;:&lt;sig&gt;</text>
  <text x="620" y="170" fill="#484f58" font-size="8" text-anchor="end">auto-generated on first boot</text>
  <text x="620" y="186" fill="#484f58" font-size="8" text-anchor="end">C2SP extension line</text>

  <!-- ─── Layer 1: Merkle (bottom, blue) ─── -->
  <rect x="40" y="208" width="600" height="64" rx="6" fill="#0d1520" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="68" y="230" fill="#58a6ff" font-size="13" font-weight="bold">ORDERING + INTEGRITY</text>
  <text x="68" y="248" fill="#8b949e" font-size="10">Merkle tree (Google tlog / RFC 6962)</text>
  <text x="68" y="262" fill="#6e7681" font-size="8">proves: "this event is in the tree, the tree is append-only"</text>
  <!-- right side -->
  <text x="620" y="230" fill="#58a6ff" font-size="9" text-anchor="end">inclusion + consistency proofs</text>
  <text x="620" y="246" fill="#484f58" font-size="8" text-anchor="end">logarithmic verification</text>
  <text x="620" y="262" fill="#484f58" font-size="8" text-anchor="end">selective disclosure</text>

  <!-- ─── Bottom: trust spectrum ─── -->
  <text x="340" y="296" fill="#484f58" font-size="9" text-anchor="middle">local Merkle = simulated physics  |  + signing = identity  |  + TSA = real physics (Landauer)</text>
  <text x="340" y="312" fill="#484f58" font-size="8" text-anchor="middle">future: PunkGo Pool (collective witnessing) adds a fourth layer</text>
</svg>
