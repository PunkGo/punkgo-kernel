<svg xmlns="http://www.w3.org/2000/svg" width="680" height="365" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Menlo,monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#3fb950" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="365" rx="8" fill="#0d1117"/>

  <!-- Terminal dots + brand -->
  <circle cx="20" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="14" r="5" fill="#febc2e"/>
  <circle cx="52" cy="14" r="5" fill="#28c840"/>
  <text x="340" y="18" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">⚡ punkgo-kernel</text>

  <!-- Title -->
  <text x="24" y="30" fill="#3fb950" font-weight="bold" font-size="14">⚡ MERKLE INCLUSION PROOF</text>
  <text x="656" y="30" fill="#6e7681" font-size="11" text-anchor="end">RFC 6962 · tree_size=8</text>

  <!-- ===== LINES (drawn first, behind nodes) ===== -->

  <!-- Dim connections: left subtree -->
  <line x1="60"  y1="262" x2="100" y2="228" stroke="#21262d" stroke-width="1"/>
  <line x1="140" y1="262" x2="100" y2="228" stroke="#21262d" stroke-width="1"/>
  <line x1="220" y1="262" x2="260" y2="228" stroke="#21262d" stroke-width="1"/>
  <line x1="300" y1="262" x2="260" y2="228" stroke="#21262d" stroke-width="1"/>
  <line x1="100" y1="204" x2="180" y2="160" stroke="#21262d" stroke-width="1"/>
  <line x1="260" y1="204" x2="180" y2="160" stroke="#21262d" stroke-width="1"/>
  <!-- Dim connections: #6,#7 to H67 -->
  <line x1="540" y1="262" x2="580" y2="228" stroke="#21262d" stroke-width="1"/>
  <line x1="620" y1="262" x2="580" y2="228" stroke="#21262d" stroke-width="1"/>

  <!-- Proof input connections (amber, dashed) -->
  <line x1="380" y1="262" x2="420" y2="228" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="580" y1="204" x2="500" y2="160" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="180" y1="136" x2="340" y2="94"  stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Verification path (green, thick) -->
  <line x1="460" y1="262" x2="420" y2="228" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="420" y1="204" x2="500" y2="160" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="500" y1="136" x2="340" y2="94"  stroke="#3fb950" stroke-width="2.5"/>

  <!-- ===== LEVEL 0: LEAVES (8 events) ===== -->

  <!-- Dim leaves: #0–#3 -->
  <rect x="46"  y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <rect x="126" y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <rect x="206" y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <rect x="286" y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <text x="60"  y="280" fill="#484f58" font-size="10" text-anchor="middle">#0</text>
  <text x="140" y="280" fill="#484f58" font-size="10" text-anchor="middle">#1</text>
  <text x="220" y="280" fill="#484f58" font-size="10" text-anchor="middle">#2</text>
  <text x="300" y="280" fill="#484f58" font-size="10" text-anchor="middle">#3</text>

  <!-- Proof[0]: leaf #4 (amber) -->
  <rect x="366" y="262" width="28" height="28" rx="4" fill="#2d2000" stroke="#d29922" stroke-width="1.5"/>
  <text x="380" y="280" fill="#d29922" font-size="10" text-anchor="middle">#4</text>

  <!-- YOUR EVENT: leaf #5 (bright green, glow) -->
  <rect x="446" y="262" width="28" height="28" rx="4" fill="#0d3321" stroke="#3fb950" stroke-width="2" filter="url(#glow)"/>
  <text x="460" y="280" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="bold">#5</text>

  <!-- Dim leaves: #6, #7 -->
  <rect x="526" y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <rect x="606" y="262" width="28" height="28" rx="4" fill="#161b22" stroke="#21262d"/>
  <text x="540" y="280" fill="#484f58" font-size="10" text-anchor="middle">#6</text>
  <text x="620" y="280" fill="#484f58" font-size="10" text-anchor="middle">#7</text>

  <!-- ===== LEVEL 1: INTERNAL NODES ===== -->

  <!-- Dim: H(#0,#1), H(#2,#3) -->
  <rect x="71"  y="204" width="58" height="24" rx="4" fill="#161b22" stroke="#21262d"/>
  <rect x="231" y="204" width="58" height="24" rx="4" fill="#161b22" stroke="#21262d"/>
  <text x="100" y="220" fill="#484f58" font-size="9" text-anchor="middle">a3b1...</text>
  <text x="260" y="220" fill="#484f58" font-size="9" text-anchor="middle">c7d4...</text>

  <!-- Computed: H(#4,#5) — green path -->
  <rect x="391" y="204" width="58" height="24" rx="4" fill="#0d2818" stroke="#26a641" stroke-width="1.5"/>
  <text x="420" y="220" fill="#26a641" font-size="9" text-anchor="middle">45ef...</text>

  <!-- Proof[1]: H(#6,#7) — amber -->
  <rect x="551" y="204" width="58" height="24" rx="4" fill="#2d2000" stroke="#d29922" stroke-width="1.5"/>
  <text x="580" y="220" fill="#d29922" font-size="9" text-anchor="middle">b92e...</text>

  <!-- ===== LEVEL 2 ===== -->

  <!-- Proof[2]: H(#0–#3) — amber -->
  <rect x="149" y="136" width="62" height="24" rx="4" fill="#2d2000" stroke="#d29922" stroke-width="1.5"/>
  <text x="180" y="152" fill="#d29922" font-size="9" text-anchor="middle">7f3a...</text>

  <!-- Computed: H(#4–#7) — green path -->
  <rect x="469" y="136" width="62" height="24" rx="4" fill="#0d2818" stroke="#26a641" stroke-width="1.5"/>
  <text x="500" y="152" fill="#26a641" font-size="9" text-anchor="middle">01cd...</text>

  <!-- ===== ROOT ===== -->

  <rect x="296" y="66" width="88" height="28" rx="5" fill="#0d3321" stroke="#3fb950" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="85" fill="#3fb950" font-size="12" text-anchor="middle" font-weight="bold">root ✓</text>

  <!-- ===== ANNOTATIONS ===== -->

  <!-- Event label -->
  <text x="460" y="305" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="bold">▲ your event</text>

  <!-- Legend -->
  <rect x="24"  y="311" width="10" height="10" rx="2" fill="#0d3321" stroke="#3fb950" stroke-width="1"/>
  <text x="40"  y="320" fill="#8b949e" font-size="10">event</text>
  <rect x="90"  y="311" width="10" height="10" rx="2" fill="#2d2000" stroke="#d29922" stroke-width="1"/>
  <text x="106" y="320" fill="#8b949e" font-size="10">proof hashes</text>
  <line x1="200" y1="316" x2="220" y2="316" stroke="#3fb950" stroke-width="2"/>
  <text x="226" y="320" fill="#8b949e" font-size="10">verified path</text>
  <line x1="320" y1="316" x2="340" y2="316" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="346" y="320" fill="#8b949e" font-size="10">proof input</text>

  <!-- Killer annotation -->
  <line x1="24" y1="335" x2="656" y2="335" stroke="#21262d"/>
  <text x="340" y="355" fill="#6e7681" font-size="12" text-anchor="middle"><tspan fill="#e6edf3" font-weight="bold">3</tspan> hashes prove <tspan fill="#e6edf3" font-weight="bold">1</tspan> event in <tspan fill="#e6edf3" font-weight="bold">8</tspan>.   At 1M events: <tspan fill="#3fb950" font-weight="bold">20</tspan> hashes.   At 1B: <tspan fill="#3fb950" font-weight="bold">30</tspan>.</text>
</svg>
