<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Menlo,monospace" font-size="12.5">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="280" rx="8" fill="#0d1117"/>

  <!-- Terminal dots + brand -->
  <circle cx="20" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="14" r="5" fill="#febc2e"/>
  <circle cx="52" cy="14" r="5" fill="#28c840"/>
  <text x="340" y="18" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">⚡ punkgo-kernel</text>

  <!-- Three primitives -->
  <!-- P (Actor) — blue -->
  <circle cx="120" cy="100" r="36" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="120" y="96" fill="#58a6ff" font-size="22" font-weight="bold" text-anchor="middle">P</text>
  <text x="120" y="114" fill="#8b949e" font-size="9" text-anchor="middle">Actor</text>

  <!-- E (Energy) — amber -->
  <circle cx="340" cy="100" r="36" fill="#0d1117" stroke="#d29922" stroke-width="2.5"/>
  <text x="340" y="96" fill="#d29922" font-size="22" font-weight="bold" text-anchor="middle">E</text>
  <text x="340" y="114" fill="#8b949e" font-size="9" text-anchor="middle">Energy</text>

  <!-- S (State) — green -->
  <circle cx="560" cy="100" r="36" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
  <text x="560" y="96" fill="#3fb950" font-size="22" font-weight="bold" text-anchor="middle">S</text>
  <text x="560" y="114" fill="#8b949e" font-size="9" text-anchor="middle">State</text>

  <!-- Arrows between primitives -->
  <!-- P → E: spends -->
  <line x1="156" y1="100" x2="296" y2="100" stroke="#484f58" stroke-width="1.5"/>
  <polygon points="296,96 304,100 296,104" fill="#484f58"/>
  <text x="226" y="92" fill="#6e7681" font-size="9" text-anchor="middle">spends</text>

  <!-- E → S: commits -->
  <line x1="376" y1="100" x2="516" y2="100" stroke="#484f58" stroke-width="1.5"/>
  <polygon points="516,96 524,100 516,104" fill="#484f58"/>
  <text x="446" y="92" fill="#6e7681" font-size="9" text-anchor="middle">commits</text>

  <!-- A (Action) label floating above the arrows -->
  <text x="340" y="52" fill="#e6edf3" font-size="10" text-anchor="middle">A = observe | create | mutate | execute</text>

  <!-- State transition formula -->
  <rect x="140" y="170" width="400" height="50" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>

  <text x="340" y="198" fill="#e6edf3" font-size="16" text-anchor="middle">
    <tspan fill="#3fb950" font-weight="bold">S'</tspan>
    <tspan fill="#484f58"> = </tspan>
    <tspan fill="#8b949e">f</tspan>
    <tspan fill="#484f58">(</tspan>
    <tspan fill="#3fb950">S</tspan>
    <tspan fill="#484f58">, </tspan>
    <tspan fill="#e6edf3">A</tspan>
    <tspan fill="#484f58">, </tspan>
    <tspan fill="#d29922">E</tspan>
    <tspan fill="#484f58">)</tspan>
    <tspan fill="#484f58" font-size="13">      </tspan>
    <tspan fill="#d29922" font-weight="bold">E'</tspan>
    <tspan fill="#484f58"> = </tspan>
    <tspan fill="#d29922">E</tspan>
    <tspan fill="#484f58"> − </tspan>
    <tspan fill="#8b949e">cost</tspan>
    <tspan fill="#484f58">(</tspan>
    <tspan fill="#e6edf3">A</tspan>
    <tspan fill="#484f58">)</tspan>
  </text>

  <!-- Bottom note -->
  <text x="340" y="256" fill="#484f58" font-size="10" text-anchor="middle">every action costs energy · every state change is append-only · every event gets a proof</text>
</svg>
